<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Kongming Chess</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
			}
			body {
				margin: 0;
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1rem;
				background: linear-gradient(180deg, #fefefe, #e9edf0);
				color: #1b1b1f;
			}
			h1 {
				margin: 0;
				letter-spacing: 0.1em;
				text-transform: uppercase;
			}
			.content-row {
				display: flex;
				align-items: center;
				gap: 2rem;
				width: 100%;
				max-width: 1100px;
				padding: 0 1.5rem;
				box-sizing: border-box;
				margin: 0 auto;
				justify-content: center;
				flex-wrap: wrap;
			}
			.menu-panel {
				position: relative;
				display: flex;
				align-items: center;
				height: 260px;
				padding-left: 20px;
				min-width: 120px;
			}
			.menu-panel.right {
				padding-right: 20px;
				padding-left: 0;
			}
			.menu-line {
				position: absolute;
				left: 0;
				top: 8px;
				bottom: 8px;
				width: 4px;
				border-radius: 999px;
				background: #d0d2d7;
			}
			.menu-items {
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				height: 100%;
				margin-left: 20px;
				text-transform: uppercase;
				letter-spacing: 0.3em;
				font-size: 0.75rem;
				font-weight: 600;
				color: rgba(27, 27, 31, 0.6);
			}
			.menu-panel.left .menu-items {
				margin-left: 0;
				margin-right: 20px;
				text-align: right;
			}
			.menu-panel.right .menu-items {
				text-align: left;
				margin-left: 40px;
			}
			.menu-items button {
				width: 100%;
				background: transparent;
				border: none;
				padding: 0;
				color: inherit;
				font: inherit;
				font-size: inherit;
				font-family: inherit;
				letter-spacing: inherit;
				text-transform: inherit;
				line-height: 1;
				text-align: inherit;
				cursor: pointer;
				-webkit-appearance: none;
			}
			.menu-item.active {
				color: #101010;
			}
			.menu-handle {
				position: absolute;
				left: 2px;
				width: 30px;
				height: 30px;
				border-radius: 50%;
				border: 4px solid rgba(0, 0, 0, 0.25);
				background: #ffffff;
				box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
				transform: translate(-50%, -50%);
				cursor: grab;
				touch-action: none;
			}
			.menu-panel.left .menu-line,
			.menu-panel.left .menu-handle {
				left: auto;
				right: 2px;
			}
			.menu-panel.left .menu-handle {
				transform: translate(50%, -50%);
			}
			.menu-handle.dragging {
				cursor: grabbing;
			}
			.board-wrapper {
				padding: 26px;
				border-radius: 8px;
				border: 1px solid rgba(0, 0, 0, 0.35);
				--light-x: 0;
				--light-y: -1;
				background:
					radial-gradient(circle at calc(50% + var(--light-x) * 25px) calc(45% - var(--light-y) * 15px), rgba(163, 97, 22, 0.9), rgba(90, 47, 22, 0.95) 65%),
					url('board_texture_2.png');
				background-size: cover;
				background-blend-mode: overlay;
				box-shadow:
					0 14px 30px rgba(0, 0, 0, 0.3),
					calc(var(--light-x) * 34px) calc(var(--light-y) * 28px) 45px rgba(255, 255, 255, 0.45),
					calc(var(--light-x) * -22px) calc(var(--light-y) * -18px) 38px rgba(8, 5, 2, 0.45);
			}
			#board {
				display: grid;
				grid-template-columns: repeat(7, 60px);
				grid-template-rows: repeat(7, 60px);
				gap: 6px;
				padding: 12px;
				background-color: #5a2f16;
				background-image: url('board_texture.png');
				background-size: cover;
				background-position: center;
				border-radius: 4px;
				box-shadow: inset 0 5px 18px rgba(255, 255, 255, 0.35), inset 0 -5px 20px rgba(0, 0, 0, 0.4), 0 6px 15px rgba(0, 0, 0, 0.25);
			}
			.hole {
				width: 60px;
				height: 60px;
				border-radius: 50%;
				background: rgba(255, 255, 255, 0.2);
				display: flex;
				align-items: center;
				justify-content: center;
				transition: transform 0.2s ease, background 0.2s ease;
				cursor: pointer;
			}
			.hole.drag-over {
				box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.7);
				background: rgba(255, 255, 255, 0.35);
			}
			.hole.disabled {
				opacity: 0;
				pointer-events: none;
			}
			.hole.selected {
				background: rgba(255, 255, 255, 0.55);
				transform: scale(1.05);
			}
			.peg {
				width: 40px;
				height: 40px;
				border-radius: 50%;
				background: radial-gradient(circle at 30% 30%, #ffffff, #d5dae1 60%, #b1b7c0);
				box-shadow: inset 0 4px 6px rgba(255, 255, 255, 0.7), inset 0 -4px 6px rgba(115, 115, 130, 0.4), 0 5px 12px rgba(0, 0, 0, 0.3);
			}
			#status {
				min-height: 1.5rem;
			}
			.bottom-controls {
				display: flex;
				gap: 1.5rem;
				align-items: center;
				justify-content: center;
				padding: 1.25rem 0 1.5rem;
				margin-top: 1rem;
				width: 100%;
			}
			.bottom-controls button {
				padding: 0.6rem 1.4rem;
				background: transparent;
				border: 0;
				color: inherit;
				font: inherit;
				text-transform: uppercase;
				letter-spacing: 0.3em;
				font-size: 0.75rem;
				cursor: pointer;
			}
			.bottom-controls button:hover {
				color: #101010;
			}
		</style>
	</head>
	<body>
		<h1>Kongming Chess</h1>
		<div id="status"></div>
		<div class="content-row">
			<div class="menu-panel left">
				<div class="menu-line"></div>
				<div class="menu-items">
					<button class="menu-item" type="button" data-menu="board">Board</button>
					<button class="menu-item" type="button" data-menu="info">Info</button>
					<button class="menu-item" type="button" data-menu="buy">Buy</button>
				</div>
				<div class="menu-handle"></div>
			</div>
			<div class="board-wrapper">
				<div id="board"></div>
			</div>
			<div class="menu-panel right">
				<div class="menu-line"></div>
				<div class="menu-items">
					<button class="menu-item" type="button" data-menu="play">Play</button>
					<button class="menu-item" type="button" data-menu="ai">AI</button>
					<button class="menu-item" type="button" data-menu="auto">Auto</button>
				</div>
				<div class="menu-handle"></div>
			</div>
		</div>
		<div class="bottom-controls">
			<button id="reset" type="button">Reset Board</button>
			<button id="shape" type="button">Shape</button>
			<button id="theme" type="button">Theme</button>
		</div>
		<script type="module" src="./dist/main.js"></script>
	</body>
</html>
